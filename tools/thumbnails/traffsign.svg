<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
  <!-- TraffSign (DAS 2022): bilingual traffic signboard with Urdu and English
       word-level detection boxes. Illustration, not a figure from the paper. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc9ee"/>
      <stop offset="1" stop-color="#e3f1fb"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11804a"/>
      <stop offset="1" stop-color="#0b6a3c"/>
    </linearGradient>
  </defs>

  <rect width="480" height="360" fill="url(#sky)"/>
  <!-- hills and roadside -->
  <path d="M0 250 Q90 205 190 238 T380 226 T480 240 V360 H0 Z" fill="#7fae6b"/>
  <path d="M0 278 Q120 250 240 270 T480 262 V360 H0 Z" fill="#5f9150"/>
  <path d="M170 360 L232 262 L248 262 L310 360 Z" fill="#6f7378"/>
  <path d="M238 268 L242 268 L246 300 L234 300 Z M232 316 L248 316 L253 360 L227 360 Z" fill="#f2f2f2"/>

  <!-- posts -->
  <rect x="112" y="200" width="10" height="130" fill="#8c9196"/>
  <rect x="358" y="200" width="10" height="130" fill="#8c9196"/>

  <!-- signboard -->
  <rect x="58" y="34" width="364" height="190" rx="12" fill="url(#board)"/>
  <rect x="66" y="42" width="348" height="174" rx="8" fill="none" stroke="#fff" stroke-width="3"/>

  <!-- row 1 -->
  <text x="150" y="104" font-family="Noto Nastaliq Urdu, Geeza Pro" font-size="30" fill="#fff" text-anchor="middle" direction="rtl">اسلام آباد</text>
  <text x="294" y="97" font-family="Helvetica, Arial" font-weight="700" font-size="21" fill="#fff" text-anchor="middle">ISLAMABAD</text>
  <path d="M378 89 h18 l-7 -7 m7 7 l-7 7" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- row 2 -->
  <text x="150" y="176" font-family="Noto Nastaliq Urdu, Geeza Pro" font-size="30" fill="#fff" text-anchor="middle" direction="rtl">مری</text>
  <text x="294" y="169" font-family="Helvetica, Arial" font-weight="700" font-size="21" fill="#fff" text-anchor="middle">MURREE</text>
  <path d="M378 161 h18 l-7 -7 m7 7 l-7 7" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- detection boxes: amber = Urdu, cyan = English -->
  <g fill="none" stroke-width="2.5" stroke-dasharray="7 4">
    <rect x="86" y="56" width="128" height="60" rx="3" stroke="#ffc83d"/>
    <rect x="226" y="72" width="136" height="34" rx="3" stroke="#5fe1ff"/>
    <rect x="118" y="130" width="64" height="58" rx="3" stroke="#ffc83d"/>
    <rect x="244" y="144" width="100" height="34" rx="3" stroke="#5fe1ff"/>
  </g>
  <g font-family="Helvetica, Arial" font-size="11" font-weight="700">
    <rect x="86" y="44" width="24" height="13" fill="#ffc83d"/><text x="98" y="54" text-anchor="middle" fill="#1d2b1d">ur</text>
    <rect x="226" y="60" width="24" height="13" fill="#5fe1ff"/><text x="238" y="70" text-anchor="middle" fill="#0b2a33">en</text>
    <rect x="118" y="118" width="24" height="13" fill="#ffc83d"/><text x="130" y="128" text-anchor="middle" fill="#1d2b1d">ur</text>
    <rect x="244" y="132" width="24" height="13" fill="#5fe1ff"/><text x="256" y="142" text-anchor="middle" fill="#0b2a33">en</text>
  </g>
</svg>
